name: Build Portable Scanner

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r portable/requirements.txt
          pip install pyinstaller
          
      - name: Build with PyInstaller (One-Directory)
        run: |
          cd portable
          pyinstaller --noconfirm --onedir --name CyberSage-Portable cybersage_portable/__main__.py
          
      - name: Create ZIP archive
        run: |
          cd portable/dist
          Compress-Archive -Path CyberSage-Portable -DestinationPath CyberSage-Portable.zip
          
      - name: Generate SHA-256 Checksum
        run: |
          cd portable/dist
          $hash = Get-FileHash -Path CyberSage-Portable.zip -Algorithm SHA256
          $hash.Hash | Out-File -FilePath CyberSage-Portable.zip.sha256 -Encoding ASCII
          
      - name: Upload Artifacts
        uses: actions/upload-artifact@v3
        with:
          name: CyberSage-Portable-Windows
          path: |
            portable/dist/CyberSage-Portable.zip
            portable/dist/CyberSage-Portable.zip.sha256
