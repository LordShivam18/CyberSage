name: Build Portable Scanner

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "portable/**"
      - "shared/**"
      - ".github/workflows/portable-build.yml"
      - "portable/pyproject.toml"
  pull_request:
    paths:
      - "portable/**"
      - "shared/**"
      - ".github/workflows/portable-build.yml"
      - "portable/pyproject.toml"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r portable/requirements.txt
          pip install pyinstaller pytest
          
      - name: Run portable unit tests and contract tests
        run: |
          $env:PYTHONPATH = "${{ github.workspace }}"
          python -m pytest portable/tests
          
      - name: Build with PyInstaller (One-Directory)
        run: |
          $env:PYTHONPATH = "${{ github.workspace }}"
          cd portable
          pyinstaller --noconfirm --onedir --name CyberSage-Portable cybersage_portable/__main__.py
          
      - name: Run smoke scan in minimal mode
        run: |
          cd portable/dist/CyberSage-Portable
          # Run without admin privileges, read-only, minimal privacy
          ./CyberSage-Portable.exe scan --output smoke_report.json --privacy minimal
          
      - name: Verify checksum and absence of secrets
        run: |
          cd portable/dist/CyberSage-Portable
          # Validate checksum using the shared contract script we can inline or use python directly
          python -c "import json, sys; sys.path.insert(0, '${{ github.workspace }}'); from shared.report_contract import verify_checksum; r = json.load(open('smoke_report.json')); assert verify_checksum(r), 'Checksum validation failed'"
          # Verify secrets absence
          $report = Get-Content smoke_report.json
          if ($report -match "password" -or $report -match "cookie" -or $report -match "token") { throw "Prohibited secret found" }
          
      - name: Cleanup temporary report
        run: |
          cd portable/dist/CyberSage-Portable
          Remove-Item smoke_report.json
          
      - name: Create ZIP archive
        run: |
          cd portable/dist
          Compress-Archive -Path CyberSage-Portable -DestinationPath CyberSage-Portable.zip
          
      - name: Generate SHA-256 Checksum
        run: |
          cd portable/dist
          $hash = Get-FileHash -Path CyberSage-Portable.zip -Algorithm SHA256
          $hash.Hash | Out-File -FilePath CyberSage-Portable.zip.sha256 -Encoding ASCII
          
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4.6.2
        with:
          name: CyberSage-Portable-Windows
          path: |
            portable/dist/CyberSage-Portable.zip
            portable/dist/CyberSage-Portable.zip.sha256
