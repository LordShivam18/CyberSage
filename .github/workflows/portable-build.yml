name: Build Portable Scanner

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "portable/**"
      - "shared/**"
      - ".github/workflows/portable-build.yml"
      - "portable/pyproject.toml"
  pull_request:
    paths:
      - "portable/**"
      - "shared/**"
      - ".github/workflows/portable-build.yml"
      - "portable/pyproject.toml"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r portable/requirements.txt
          pip install pyinstaller pytest
          
      - name: Run portable unit tests and contract tests
        run: |
          $env:PYTHONPATH = "${{ github.workspace }}"
          python -m pytest portable/tests
          
      - name: Build with PyInstaller (One-Directory)
        run: |
          $env:PYTHONPATH = "${{ github.workspace }}"
          cd portable
          pyinstaller --noconfirm --onedir --name CyberSage-Portable launcher.py
          
      - name: Run smoke scan in minimal mode
        run: |
          cd portable/dist/CyberSage-Portable
          # Run without admin privileges, read-only, minimal privacy
          ./CyberSage-Portable.exe scan --output smoke-output --privacy-mode minimal
          
      - name: Verify report schema, checksum, and absence of secrets
        run: |
          cd portable/dist/CyberSage-Portable
          $reports = Get-ChildItem -Path smoke-output -Filter "assessment_*.json"
          if ($reports.Count -ne 1) {
              throw "Expected exactly 1 JSON report, found $($reports.Count)"
          }
          $reportPath = $reports[0].FullName
          
          python -c "
          import json, sys
          sys.path.insert(0, '${{ github.workspace }}')
          from shared.report_contract import verify_checksum
          from portable.cybersage_portable.schemas.validator import validate_report
          
          with open(r'$reportPath', 'r', encoding='utf-8') as f:
              r = json.load(f)
              
          if not verify_checksum(r):
              sys.exit('Checksum validation failed')
              
          if not validate_report(r):
              sys.exit('Schema validation failed')
              
          # Structured secret inspection
          def check_secrets(obj):
              if isinstance(obj, dict):
                  for k, v in obj.items():
                      kl = k.lower()
                      if 'password' in kl or 'cookie' in kl or 'token' in kl:
                          sys.exit(f'Prohibited secret field found: {k}')
                      check_secrets(v)
              elif isinstance(obj, list):
                  for item in obj:
                      check_secrets(item)
          check_secrets(r)
          "
          
      - name: Cleanup temporary output
        if: always()
        run: |
          cd portable/dist/CyberSage-Portable
          if (Test-Path smoke-output) {
              Remove-Item -Recurse -Force smoke-output
          }
          
      - name: Create ZIP archive
        run: |
          cd portable/dist
          Compress-Archive -Path CyberSage-Portable -DestinationPath CyberSage-Portable.zip
          
      - name: Generate SHA-256 Checksum
        run: |
          cd portable/dist
          $hash = Get-FileHash -Path CyberSage-Portable.zip -Algorithm SHA256
          $hash.Hash | Out-File -FilePath CyberSage-Portable.zip.sha256 -Encoding ASCII
          
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4.6.2
        with:
          name: CyberSage-Portable-Windows
          path: |
            portable/dist/CyberSage-Portable.zip
            portable/dist/CyberSage-Portable.zip.sha256
