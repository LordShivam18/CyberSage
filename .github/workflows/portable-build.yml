name: Build Portable Scanner

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "portable/**"
      - "shared/**"
      - ".github/workflows/portable-build.yml"
      - "portable/pyproject.toml"
  pull_request:
    paths:
      - "portable/**"
      - "shared/**"
      - ".github/workflows/portable-build.yml"
      - "portable/pyproject.toml"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          $ErrorActionPreference = "Stop"
          python -m pip install --upgrade pip
          python -m pip install -e "./portable[dev,build,win]"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run portable unit tests and contract tests
        run: |
          $env:PYTHONPATH = "${{ github.workspace }}"
          python -m pytest portable/tests
          
      - name: Build with PyInstaller (One-Directory)
        run: |
          $env:PYTHONPATH = "${{ github.workspace }}"
          cd portable
          pyinstaller --noconfirm --onedir --name CyberSage-Portable launcher.py
          
      - name: Run smoke scan in minimal mode
        run: |
          cd portable/dist/CyberSage-Portable
          # Run without admin privileges, read-only, minimal privacy
          ./CyberSage-Portable.exe scan --output smoke-output --privacy-mode minimal
          
      - name: Verify report schema, checksum, and absence of secrets
        run: |
          $ErrorActionPreference = "Stop"
          $reports = Get-ChildItem -Path "portable/dist/CyberSage-Portable/smoke-output" -Filter "assessment_*.json"
          if (@($reports).Count -ne 1) {
              throw "Expected exactly one JSON report."
          }
          
          $env:PYTHONPATH = "${{ github.workspace }}"
          python portable/ci/verify_smoke_report.py $reports[0].FullName
          
          if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
          }
          
      - name: Cleanup temporary output
        if: always()
        run: |
          $ErrorActionPreference = "Stop"
          if (Test-Path "portable/dist/CyberSage-Portable/smoke-output") {
              Remove-Item -Recurse -Force "portable/dist/CyberSage-Portable/smoke-output"
          }
          
      - name: Create ZIP archive
        run: |
          cd portable/dist
          Compress-Archive -Path CyberSage-Portable -DestinationPath CyberSage-Portable.zip
          
      - name: Generate SHA-256 Checksum
        run: |
          cd portable/dist
          $hash = Get-FileHash -Path CyberSage-Portable.zip -Algorithm SHA256
          $hash.Hash | Out-File -FilePath CyberSage-Portable.zip.sha256 -Encoding ASCII
          
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4.6.2
        with:
          name: CyberSage-Portable-Windows
          path: |
            portable/dist/CyberSage-Portable.zip
            portable/dist/CyberSage-Portable.zip.sha256
