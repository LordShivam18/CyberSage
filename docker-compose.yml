services:
  kafka:
    image: bitnami/kafka:3.7
    container_name: ndr_kafka
    ports:
      - "9094:9094"
    environment:
      - KAFKA_CFG_NODE_ID=1
      - KAFKA_CFG_PROCESS_ROLES=broker,controller
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=true
      - ALLOW_PLAINTEXT_LISTENER=yes
    volumes:
      - kafka_data:/bitnami/kafka
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server kafka:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10

  db:
    image: postgres:15-alpine
    container_name: ndr_postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER:?set POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:?set POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?set POSTGRES_USER} -d ${POSTGRES_DB:?set POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ndr_migrate
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app/backend
      - ./results:/app/results
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:?set POSTGRES_USER}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:?set POSTGRES_DB}
      - JWT_SECRET=${JWT_SECRET:?set JWT_SECRET}
      - APP_ENV=${APP_ENV:-development}
    command: python -m backend.cli migrate

  backend-api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ndr_backend_api
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
      - ./results:/app/results
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:?set POSTGRES_USER}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:?set POSTGRES_DB}
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - RAW_NETWORK_EVENTS_TOPIC=raw.network-events
      - NORMALIZED_NETWORK_EVENTS_TOPIC=normalized.network-events
      - DETECTIONS_TOPIC=detections
      - DEAD_LETTER_TOPIC=dead-letter-events
      - KAFKA_TOPIC=network_traffic
      - JWT_SECRET=${JWT_SECRET:?set JWT_SECRET}
      - APP_ENV=${APP_ENV:-development}
      - AUTO_MIGRATE=false
      - CORS_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=3)\""]
      interval: 10s
      timeout: 5s
      retries: 10

  detection-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ndr_detection_worker
    depends_on:
      backend-api:
        condition: service_healthy
      kafka:
        condition: service_healthy
    volumes:
      - ./backend:/app/backend
      - ./results:/app/results
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:?set POSTGRES_USER}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:?set POSTGRES_DB}
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - RAW_NETWORK_EVENTS_TOPIC=raw.network-events
      - NORMALIZED_NETWORK_EVENTS_TOPIC=normalized.network-events
      - DETECTIONS_TOPIC=detections
      - DEAD_LETTER_TOPIC=dead-letter-events
      - KAFKA_TOPIC=network_traffic
      - KAFKA_WORKER_GROUP_ID=ndr-detection-worker
      - JWT_SECRET=${JWT_SECRET:?set JWT_SECRET}
      - APP_ENV=${APP_ENV:-development}
      - AUTO_MIGRATE=false
    command: python -m backend.worker

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: ndr_frontend
    depends_on:
      backend-api:
        condition: service_healthy
    ports:
      - "3000:3000"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    environment:
      - DANGEROUSLY_DISABLE_HOST_CHECK=true
      - WDS_SOCKET_PORT=3000
      - REACT_APP_API_BASE_URL=http://localhost:8000

volumes:
  kafka_data:
  postgres_data:
