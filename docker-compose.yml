services:
  kafka:
    image: apache/kafka:3.9.2
    hostname: kafka
    container_name: ndr_kafka
    ports:
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: CONTROLLER://:29093,PLAINTEXT://:9092,PLAINTEXT_HOST://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9094
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s

  db:
    image: postgres:15-alpine
    container_name: ndr_postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER:?set POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:?set POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?set POSTGRES_USER} -d ${POSTGRES_DB:?set POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ndr_migrate
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app/backend
      - ./results:/app/results
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:?set POSTGRES_USER}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:?set POSTGRES_DB}
      - JWT_SECRET=${JWT_SECRET:?set JWT_SECRET}
      - APP_ENV=${APP_ENV:-development}
    command: python -m backend.cli migrate

  backend-api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ndr_backend_api
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
      - ./results:/app/results
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:?set POSTGRES_USER}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:?set POSTGRES_DB}
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - RAW_NETWORK_EVENTS_TOPIC=raw.network-events
      - NORMALIZED_NETWORK_EVENTS_TOPIC=normalized.network-events
      - DETECTIONS_TOPIC=detections
      - DEAD_LETTER_TOPIC=dead-letter-events
      - KAFKA_TOPIC=network_traffic
      - JWT_SECRET=${JWT_SECRET:?set JWT_SECRET}
      - APP_ENV=${APP_ENV:-development}
      - AUTO_MIGRATE=false
      - CORS_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
      - API_BIND_HOST=0.0.0.0
      - API_PORT=8000
    command: >-
      sh -c 'exec uvicorn backend.main:app --host "$API_BIND_HOST" --port "$API_PORT" --reload'
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=3)\""]
      interval: 10s
      timeout: 5s
      retries: 10

  detection-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ndr_detection_worker
    depends_on:
      backend-api:
        condition: service_healthy
      kafka:
        condition: service_healthy
    volumes:
      - ./backend:/app/backend
      - ./results:/app/results
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:?set POSTGRES_USER}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:?set POSTGRES_DB}
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - RAW_NETWORK_EVENTS_TOPIC=raw.network-events
      - NORMALIZED_NETWORK_EVENTS_TOPIC=normalized.network-events
      - DETECTIONS_TOPIC=detections
      - DEAD_LETTER_TOPIC=dead-letter-events
      - KAFKA_TOPIC=network_traffic
      - KAFKA_WORKER_GROUP_ID=ndr-detection-worker
      - JWT_SECRET=${JWT_SECRET:?set JWT_SECRET}
      - APP_ENV=${APP_ENV:-development}
      - AUTO_MIGRATE=false
    command: python -m backend.worker

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: ndr_frontend
    depends_on:
      backend-api:
        condition: service_healthy
    ports:
      - "3000:3000"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    environment:
      - DANGEROUSLY_DISABLE_HOST_CHECK=true
      - WDS_SOCKET_PORT=3000
      - REACT_APP_API_BASE_URL=http://localhost:8000
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"require('http').get('http://127.0.0.1:3000/', response => process.exit(response.statusCode >= 200 && response.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))\""
        ]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

volumes:
  postgres_data:
